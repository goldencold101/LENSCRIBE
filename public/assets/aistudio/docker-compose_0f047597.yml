version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Lenscribe-Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - PORT=8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Optional: local Ollama service for the Ollama vision engine.
  # Uncomment to run a fully self-contained local OCR stack.
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

